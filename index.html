<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixcation</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script>
        window.APP_CACHE_BUSTER = new Date().toISOString().slice(0, 10);
        const fontStyle = document.createElement('style');
        fontStyle.textContent = `
            @font-face {
                font-family: 'm6x11';
                src: url('media/fonts/m6x11plus.ttf?v=${window.APP_CACHE_BUSTER}') format('truetype');
                font-weight: normal;
                font-style: normal;
                font-display: block;
            }
        `;
        document.head.appendChild(fontStyle);
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const supportScripts = ['game-data.js', 'water-pipeline.js', 'art.js', 'world.js', 'environment.js', 'fish.js', 'fishing.js', 'treasure.js', 'ui.js'];
        if (new URLSearchParams(window.location.search).has('test')) supportScripts.push('automated-tests.js');
        const loadGameScript = source => new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = `${source}?v=${window.APP_CACHE_BUSTER}`;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });
        const loadGame = async () => {
            for (let index = 0; index < supportScripts.length; index += 3) {
                await Promise.all(supportScripts.slice(index, index + 3).map(loadGameScript));
            }
            await loadGameScript('phaser.js');
        };

        loadGame();
    </script>
</body>
