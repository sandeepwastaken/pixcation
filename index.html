<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixcation</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script>
        const developmentAssets = new URLSearchParams(window.location.search).has('dev');
        window.APP_CACHE_BUSTER = developmentAssets ? Date.now() : '1';
        const fontStyle = document.createElement('style');
        fontStyle.textContent = `
            @font-face {
                font-family: 'm6x11';
                src: url('media/m6x11plus.ttf?v=${window.APP_CACHE_BUSTER}') format('truetype');
                font-weight: normal;
                font-style: normal;
                font-display: block;
            }
        `;
        document.head.appendChild(fontStyle);
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const gameScripts = ['water-pipeline.js', 'phaser.js'];
        const loadGameScript = index => {
            const script = document.createElement('script');
            script.src = `${gameScripts[index]}?v=${window.APP_CACHE_BUSTER}`;
            if (index + 1 < gameScripts.length) script.onload = () => loadGameScript(index + 1);
            document.body.appendChild(script);
        };

        loadGameScript(0);
    </script>
</body>
